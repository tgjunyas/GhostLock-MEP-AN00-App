name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship an Android SDK, so we look for it
      # instead of depending on a third-party setup action (which is one more
      # thing that can break). Only if nothing is found do we install the
      # command-line tools ourselves.
      - name: Provide an Android SDK
        run: |
          set -eu
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                   /usr/local/lib/android/sdk "$HOME/Android/Sdk" "$HOME/android-sdk"; do
            if [ -n "$d" ] && [ -d "$d/platform-tools" ]; then
              echo "ANDROID_HOME=$d"      >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$d"  >> "$GITHUB_ENV"
              echo "[*] using preinstalled SDK: $d"
              exit 0
            fi
          done

          echo "[*] no SDK found; installing command-line tools"
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Accept SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease > build.log 2>&1
          rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then
            # Surface the failure as a check annotation: job logs need admin
            # rights to read over the API, annotations do not.
            tail -n 60 build.log | sed 's/\r$//' | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $rc

      - name: Check the exploit really made it into the APK
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'libgl\.so' || {
            echo "libgl.so missing from the APK"; exit 1; }
          ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: GhostLock-MEP-AN00
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
