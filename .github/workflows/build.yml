name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship an Android SDK, so we look for it
      # instead of depending on a third-party setup action (which is one more
      # thing that can break). Only if nothing is found do we install the
      # command-line tools ourselves.
      - name: Provide an Android SDK
        run: |
          set -eu
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                   /usr/local/lib/android/sdk "$HOME/Android/Sdk" "$HOME/android-sdk"; do
            if [ -n "$d" ] && [ -d "$d/platform-tools" ]; then
              echo "ANDROID_HOME=$d"      >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$d"  >> "$GITHUB_ENV"
              echo "[*] using preinstalled SDK: $d"
              exit 0
            fi
          done

          echo "[*] no SDK found; installing command-line tools"
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Accept SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease > build.log 2>&1
          rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then
            # Surface the failure as check annotations: job logs need admin
            # rights to read over the API, annotations do not. Gradle buries the
            # human-readable cause above a very long stack trace, so pull the
            # "What went wrong" block and the Caused-by chain specifically.
            emit() { while IFS= read -r l; do echo "::error::${l}"; done; }
            echo "::error::=== log head ==="
            head -25 build.log | emit
            echo "::error::=== what went wrong ==="
            awk '/^\* What went wrong:/{p=1} p&&/^\* Try:/{p=0} p' build.log | head -40 | emit
            echo "::error::=== caused by ==="
            grep -n "Caused by:" build.log | head -12 | emit
            echo "::error::=== matched errors ==="
            grep -nE "^> |error:|Could not|Unsupported|not accepted|requires|No matching" build.log | head -25 | emit
          fi
          exit $rc

      - name: Check the exploit really made it into the APK
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'libgl\.so' || {
            echo "libgl.so missing from the APK"; exit 1; }
          ls -l "$APK"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GhostLock-MEP-AN00
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Job logs need admin rights to read over the API, which makes debugging a
      # red run awkward from a script. On failure, park the full log on its own
      # branch instead; it is plain `git show` material afterwards.
      - name: Publish the build log to the ci-logs branch
        if: failure()
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p .ci-logs
          if [ -f build.log ]; then cp build.log .ci-logs/build.log; else echo "(no build.log)" > .ci-logs/build.log; fi
          git add -f .ci-logs
          git commit -m "ci log for ${GITHUB_SHA}"
          git push -f origin ci-logs
